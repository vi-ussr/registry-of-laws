title: Register of Laws
baseurl: ""
register_date: "2026-11-02"

collections:
  versions:
    output: true
  laws:
    output: true
    permalink: /laws/:name/

defaults:
  - scope:
      path: ""
      type: laws
    values:
      layout: law
  - scope:
      path: ""
      type: versions
    values:
      layout: law
      render_with_liquid: false

exclude:
  - docs
  - examples
