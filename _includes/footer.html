<footer>
  <div class="footer-sections">
    {% for group in site.data.navigation %}
      <nav aria-label="{{ group.title | escape }}">
        <h2>{{ group.title | escape }}</h2>
        {% for link in group.links %}
          <a href="{{ link.url | relative_url }}">{{ link.title | escape }}</a>
        {% endfor %}
      </nav>
    {% endfor %}
  </div>
  <p>{% include institution.html %}</p>
  <p>Project author &middot; {{ site.data.presentation.author | escape }}</p>
</footer>
